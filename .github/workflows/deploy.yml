# (10부) main에 push → 테스트 → 이미지 빌드·업로드 → 서버 반영
name: test-build-deploy

on:
  push:
    branches: [main]
  pull_request:          # PR에서는 테스트만
  workflow_dispatch:     # Actions 탭에서 손으로 실행하기

jobs:
  test:
    runs-on: ubuntu-latest
    # 테스트용 MySQL을 잠깐 띄워요. 통합 테스트(TapFlowIntegrationTest)가 여기에 붙어요.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nfcreview
          MYSQL_USER: nfcreview
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u nfcreview -pci-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test
        env:
          DB_URL: jdbc:mysql://localhost:3306/nfcreview?serverTimezone=UTC
          DB_USERNAME: nfcreview
          DB_PASSWORD: ci-password

  build-and-push:
    needs: test          # 테스트가 통과해야만 실행
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # ghcr.io에 이미지를 올릴 권한
    steps:
      - uses: actions/checkout@v7
      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub가 실행할 때마다 자동으로 만들어주는 임시 열쇠
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy     # 배포가 동시에 두 개 돌지 않게
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/nfcreview
            git pull --ff-only
            cd deploy
            docker compose pull app
            docker compose up -d
            docker image prune -f
