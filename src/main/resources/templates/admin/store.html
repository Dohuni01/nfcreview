<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('카드 관리')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav}"></header>
<main class="container">
  <p><a th:href="@{/admin/stores}">← 가게 목록</a></p>
  <div th:replace="~{admin/fragments :: flash}"></div>

  <div class="title-row">
    <h1 th:text="${store.name}">가게 이름</h1>
    <div class="actions">
      <a class="btn secondary" th:href="@{/admin/stores/{id}/edit(id=${store.id})}">정보 수정</a>
      <a class="btn" th:href="@{/admin/stores/{id}/stats(id=${store.id})}">통계 보기</a>
    </div>
  </div>

  <section class="panel">
    <p><strong>리뷰 주소</strong><br><code th:text="${store.reviewUrl}">https://...</code></p>
    <p><strong>랜딩 모드</strong><br><span th:text="${store.landingMode}">DIRECT</span></p>
    <p th:if="${store.landingMode.name() == 'CUSTOM'}">
      <strong>정적 홈페이지</strong><br><code th:text="${store.landingUrl} ?: '(미입력)'">https://...</code>
    </p>
  </section>

  <h2>카드 발급</h2>
  <form class="panel row-form" th:action="@{/admin/stores/{id}/cards(id=${store.id})}" method="post">
    <input name="label" maxlength="50" placeholder="위치 메모 (예: 3번 테이블)">
    <button>카드 만들기</button>
  </form>

  <h2>카드 목록</h2>
  <p class="help">"NFC에 쓸 주소"를 복사해서 NFC Tools로 카드에 쓰면 돼요. 미리보기로 열면 태그(TAP)는 기록되지 않아요.</p>
  <p class="empty" th:if="${#lists.isEmpty(cards)}">아직 카드가 없어요.</p>

  <div class="table-wrap" th:unless="${#lists.isEmpty(cards)}">
    <table>
      <thead>
      <tr><th>위치</th><th>NFC에 쓸 주소</th><th>상태</th><th></th></tr>
      </thead>
      <tbody>
      <tr th:each="card : ${cards}" th:classappend="${card.active} ? '' : 'inactive'">
        <td th:text="${card.label} ?: '(메모 없음)'">3번 테이블</td>
        <td>
          <code th:text="${baseUrl} + '/t/' + ${card.code}">http://localhost:8080/t/abc</code>
          <button type="button" class="small secondary"
                  th:data-url="${baseUrl} + '/t/' + ${card.code}"
                  onclick="navigator.clipboard.writeText(this.dataset.url).then(() => { this.textContent = '복사됨'; })">복사</button>
        </td>
        <td>
          <span class="badge" th:classappend="${card.active} ? 'on' : 'off'"
                th:text="${card.active} ? '사용 중' : '꺼짐'">사용 중</span>
        </td>
        <td class="actions">
          <form class="inline" th:action="@{/admin/cards/{id}/toggle(id=${card.id})}" method="post">
            <button class="small secondary" th:text="${card.active} ? '끄기' : '켜기'">끄기</button>
          </form>
          <button type="button" class="small danger"
                  th:data-card-id="${card.id}"
                  th:data-card-label="${card.label} ?: '(메모 없음)'"
                  onclick="openCardDeleteDialog(this)">삭제</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- 카드 삭제 확인 다이얼로그 -->
<dialog id="card-delete-dialog">
  <p class="dialog-title">카드를 삭제하시겠어요?</p>
  <p class="dialog-desc" id="card-dialog-label"></p>
  <p class="dialog-warn">이 카드의 태그·리뷰 기록이 모두 삭제되며 되돌릴 수 없어요.</p>
  <form id="card-delete-form" method="post">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
    <div class="dialog-actions">
      <button type="button" class="secondary" onclick="document.getElementById('card-delete-dialog').close()">아니요</button>
      <button type="submit" class="danger">네, 삭제할게요</button>
    </div>
  </form>
</dialog>

<style>
td.actions { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
td.actions > * { margin-right: 0; }

dialog {
  border: none; border-radius: 14px; padding: 28px 24px 20px;
  max-width: 340px; width: calc(100% - 40px);
  box-shadow: 0 8px 32px rgba(43,29,20,0.18); background: var(--panel);
}
dialog::backdrop { background: rgba(43,29,20,0.45); }
.dialog-title  { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--ink); }
.dialog-desc   { margin: 0 0 10px; font-weight: 600; color: var(--red); }
.dialog-warn   { margin: 0 0 22px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-actions button { min-width: 80px; }
button.danger { background: #c0392b; color: #fff; border: none; }
button.danger:hover { background: #a93226; }
</style>

<script>
function openCardDeleteDialog(btn) {
  document.getElementById('card-dialog-label').textContent = btn.dataset.cardLabel;
  document.getElementById('card-delete-form').action = '/admin/cards/' + btn.dataset.cardId + '/delete';
  document.getElementById('card-delete-dialog').showModal();
}
</script>
</body>
</html>
