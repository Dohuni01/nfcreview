<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('통계')}"></head>
<body>
<header th:replace="~{admin/fragments :: nav}"></header>
<main class="container">
  <p><a th:href="@{/admin/stores}">← 가게 목록</a></p>
  <div th:replace="~{admin/fragments :: flash}"></div>

  <div class="title-row">
    <h1 th:text="|${store.name} 통계|">가게 통계</h1>
    <div class="title-actions">
      <nav class="tabs">
        <a th:each="d : ${periods}"
           th:href="@{/admin/stores/{id}/stats(id=${store.id}, days=${d})}"
           th:classappend="${d == stats.days} ? 'active'"
           th:text="|최근 ${d}일|">최근 30일</a>
      </nav>
      <a class="btn secondary small"
         th:href="@{/admin/stores/{id}/stats/csv(id=${store.id}, days=${stats.days})}">CSV 내보내기</a>
      <button type="button" class="btn danger small" onclick="openResetStep1()">통계 초기화</button>
    </div>
  </div>

  <section class="summary">
    <div class="metric"><span>태그</span><strong th:text="${stats.taps}">0</strong></div>
    <div class="metric"><span>리뷰 버튼</span><strong th:text="${stats.clicks}">0</strong></div>
    <div class="metric highlight"><span>전환율</span><strong th:text="|${stats.conversionPercent}%|">0%</strong></div>
  </section>
  <p class="help">전환율 = 리뷰 버튼 수 ÷ 태그 수. 날짜는 한국 시간 기준이에요. 실제로 리뷰를 썼는지는 네이버에서만 알 수 있어요.</p>

  <h2>날짜별</h2>
  <div class="table-wrap">
    <table>
      <thead>
      <tr><th>날짜</th><th>태그</th><th class="bar-cell"></th><th>리뷰 버튼</th></tr>
      </thead>
      <tbody>
      <tr th:each="row : ${stats.daily}">
        <td th:text="${#temporals.format(row.day, 'MM.dd (E)')}">09.24 (목)</td>
        <td th:text="${row.taps}">0</td>
        <!-- 막대 길이 = 기간 중 가장 많았던 날 대비 비율 -->
        <td class="bar-cell"><div class="bar" th:style="|width: ${row.barPercent}%|"></div></td>
        <td th:text="${row.clicks}">0</td>
      </tr>
      </tbody>
    </table>
  </div>

  <h2>카드별</h2>
  <p class="empty" th:if="${#lists.isEmpty(stats.cards)}">아직 발급한 카드가 없어요.</p>
  <div class="table-wrap" th:unless="${#lists.isEmpty(stats.cards)}">
    <table>
      <thead>
      <tr><th>위치</th><th>코드</th><th>태그</th><th>리뷰 버튼</th><th>전환율</th></tr>
      </thead>
      <tbody>
      <tr th:each="card : ${stats.cards}" th:classappend="${card.active} ? '' : 'inactive'">
        <td th:text="${card.label} ?: '(메모 없음)'">3번 테이블</td>
        <td><code th:text="${card.code}">code</code></td>
        <td th:text="${card.taps}">0</td>
        <td th:text="${card.clicks}">0</td>
        <td th:text="|${card.conversionPercent}%|">0%</td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- 통계 초기화 2단 확인 다이얼로그 -->
<dialog id="reset-dialog">
  <!-- 1단계 -->
  <div id="reset-step1">
    <p class="dialog-title">통계를 초기화하시겠어요?</p>
    <p class="dialog-warn">태그·리뷰 버튼의 모든 기록이 삭제돼요. 카드와 가게 정보는 유지돼요.</p>
    <div class="dialog-actions">
      <button type="button" class="secondary" onclick="document.getElementById('reset-dialog').close()">아니요</button>
      <button type="button" class="danger" onclick="goResetStep2()">계속</button>
    </div>
  </div>
  <!-- 2단계 -->
  <div id="reset-step2" style="display:none">
    <p class="dialog-title">정말로 삭제할까요?</p>
    <p class="dialog-warn" style="color:var(--red);font-weight:600">되돌릴 수 없어요. 한 번 더 확인해주세요.</p>
    <form th:action="@{/admin/stores/{id}/stats/reset(id=${store.id})}" method="post">
      <input type="hidden" name="_csrf" th:value="${_csrf.token}">
      <div class="dialog-actions">
        <button type="button" class="secondary" onclick="document.getElementById('reset-dialog').close()">취소</button>
        <button type="submit" class="danger">네, 초기화할게요</button>
      </div>
    </form>
  </div>
</dialog>

<style>
.title-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn.small { padding: 6px 12px; font-size: 13px; }

dialog {
  border: none; border-radius: 14px; padding: 28px 24px 20px;
  max-width: 340px; width: calc(100% - 40px);
  box-shadow: 0 8px 32px rgba(43,29,20,0.18); background: var(--panel);
}
dialog::backdrop { background: rgba(43,29,20,0.45); }
.dialog-title  { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--ink); }
.dialog-warn   { margin: 0 0 22px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog-actions button { min-width: 80px; }
button.danger { background: #c0392b; color: #fff; border: none; }
button.danger:hover { background: #a93226; }
</style>

<script>
function openResetStep1() {
  document.getElementById('reset-step1').style.display = '';
  document.getElementById('reset-step2').style.display = 'none';
  document.getElementById('reset-dialog').showModal();
}
function goResetStep2() {
  document.getElementById('reset-step1').style.display = 'none';
  document.getElementById('reset-step2').style.display = '';
}
</script>
</body>
</html>
